<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <meta name="color-scheme" content="light dark">
  <title>订阅转换 · Yanyu Sub</title>
  <meta name="description" content="合并订阅，转换为 Surge 或 Mihomo 配置并生成永久订阅链接。">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon-swap.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到转换工具</a>
  <div class="shell">
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="Yanyu Sub 首页"><span class="brand-mark" aria-hidden="true"></span><b>Yanyu Sub</b></a>
      <nav class="header-actions" aria-label="站点操作">
        <button id="theme-toggle" class="theme-toggle" type="button" hidden><svg class="theme-icon theme-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
          <svg class="theme-icon theme-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <svg class="theme-icon theme-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15A8 8 0 0 1 9 4a8 8 0 1 0 11 11Z"/></svg>
          <span id="theme-label" class="sr-only"></span></button>
        <button id="about" class="about-link" type="button" aria-haspopup="dialog" aria-controls="about-dialog">关于</button>
      </nav>
    </header>
    <main id="main">
      <div class="page-head">
        <h1 id="page-title">订阅转换</h1>
      </div>
      <form id="convert-form" autocomplete="off" novalidate>
        <section class="field-group" aria-labelledby="sources-title">
          <div class="group-head"><h2 id="sources-title">订阅来源</h2></div>
          <p id="sources-help" class="sr-only">粘贴一个订阅链接，或一整段订阅文本。</p>
          <textarea id="source-input" class="source-input" rows="6" placeholder="粘贴订阅链接或文本…" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-labelledby="sources-title" aria-describedby="sources-help"></textarea>
        </section>
        <section class="field-group" aria-labelledby="target-title">
          <div class="group-head"><h2 id="target-title">输出格式</h2></div>
          <fieldset class="target-options"><legend class="sr-only">输出格式</legend>
            <label class="target-option"><input type="radio" name="target" value="Surge" checked><span class="target-description"><strong>Surge</strong></span><span class="radio-indicator" aria-hidden="true"></span></label>
            <label class="target-option"><input type="radio" name="target" value="Mihomo"><span class="target-description"><strong>Mihomo</strong></span><span class="radio-indicator" aria-hidden="true"></span></label>
          </fieldset>
          <button id="publish" class="button button-primary" type="submit">生成订阅链接</button>
        </section>
      </form>
      <div id="publish-status" class="publish-status" role="status" aria-live="polite" aria-atomic="true"></div>
      <section id="error-panel" class="notice notice-error" role="alert" tabindex="-1" hidden><h2>请检查订阅</h2><p id="error-message"></p></section>
      <section id="result" class="result" aria-labelledby="result-title" tabindex="-1" hidden>
        <div class="group-head result-head"><h2 id="result-title">订阅链接</h2></div>
        <div id="published" class="published" hidden>
          <label class="sr-only" for="published-url">订阅链接</label>
          <input id="published-url" class="published-url" type="text" readonly autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
          <div class="published-actions"><button id="copy-published" class="button button-primary" type="button">复制链接</button><button id="revoke-published" class="button button-quiet" type="button">撤销链接</button></div>
        </div>
        <details class="preview">
          <summary>查看配置</summary>
          <label class="sr-only" for="config-preview">生成的配置内容</label>
          <textarea id="config-preview" readonly spellcheck="false" wrap="off"></textarea>
        </details>
      </section>
    </main>
  </div>

<dialog id="about-dialog" aria-labelledby="about-title" aria-describedby="about-subtitle">
  <form method="dialog" class="about-close-form"><button type="submit" id="about-close" aria-label="关闭关于">×</button></form>
  <h2 id="about-title" class="about-title"><strong>YANYU</strong> Sub</h2>
  <p id="about-subtitle" class="about-subtitle">订阅转换</p>
  <a class="about-contact" href="https://t.me/+88807915423" target="_blank" rel="noopener noreferrer">Telegram <span aria-hidden="true">↗</span></a>
  <p class="about-copyright">© 2026 YANYU · YANYU SUB</p>
  <p class="about-rights">网站设计版权归 YANYU 所有</p>
</dialog>
</body>
</html>
